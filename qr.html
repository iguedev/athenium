<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - ATHENIUM</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .qr-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .qr-wrapper {
            background: rgba(255, 255, 255, 0.05);
            padding: 3rem;
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        #qrcode {
            background: white;
            padding: 1rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-title {
            font-family: "TheGoodMonolith", monospace;
            color: var(--color-title);
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 0.1em;
        }

        .qr-subtitle {
            font-family: "TheGoodMonolith", monospace;
            color: var(--color-text);
            font-size: 0.875rem;
            text-align: center;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }

        .brand-name {
            position: fixed;
            top: 2rem;
            left: 2rem;
            font-family: "TheGoodMonolith", monospace;
            font-size: 1.5rem;
            color: var(--color-title);
            letter-spacing: 0.2em;
            z-index: 1000;
        }

        /* Show main content immediately for this page */
        main {
            opacity: 1 !important;
            visibility: visible !important;
        }
    </style>
</head>
<body>
    <!-- Brand name in top left corner -->
    <div class="brand-name">ATHENIUM</div>

    <main>
        <div class="qr-container">
            <div class="qr-wrapper">
                <div class="qr-title">ATHENIUM INSIDES</div>
                <div id="qrcode"></div>
                <div class="qr-subtitle">ONLY FOR REAL TRADERS</div>
            </div>
        </div>
    </main>

    <script>
        // Get the current URL base
        const baseUrl = window.location.origin;
        
        // Generate QR code
        new QRCode(document.getElementById("qrcode"), {
            text: baseUrl + "/",
            width: 256,
            height: 256,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
